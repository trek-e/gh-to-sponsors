services:
  approval-server:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - APPROVAL_SECRET=${APPROVAL_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Development mode with hot reload
  approval-server-dev:
    build:
      context: .
      target: builder
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - APPROVAL_SECRET=${APPROVAL_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
    volumes:
      - ./src:/app/src:ro
    command: npx tsx watch src/server/index.ts
    profiles:
      - dev
